<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>살아있는 보안 책들</title>
<style>
  :root { --bg:#fafafa; --fg:#1a1a1a; --card:#fff; --line:#e3e3e3; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161923; --fg:#e8e8e8; --card:#1f2330; --line:#2e3342; --accent:#7aa2ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"Pretendard","Noto Sans KR",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:3rem 16px; }
  h1 { font-size:1.8rem; margin:0 0 .5rem; }
  p.lead { opacity:.75; margin:0 0 2rem; }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1.25rem 1.5rem; margin-bottom:1rem; }
  a.card:hover { border-color:var(--accent); }
  a.card h2 { margin:0 0 .35rem; font-size:1.2rem; color:var(--accent); }
  a.card p { margin:0; opacity:.8; line-height:1.5; }
  footer { margin-top:2.5rem; font-size:.85rem; opacity:.6; }
</style>
</head>
<body>
<main>
  <h1>살아있는 보안 책들</h1>
  <p class="lead">계속 개정되는 책. 어디를 펴도 같은 구조, 모든 장에 상태 배지, 누구나 고칠 수 있는 편집 링크.</p>

  <a class="card" href="vulnerability-bible/">
    <h2>취약점 분석 바이블</h2>
    <p>입문자부터 시니어까지. 웹·바이너리·확장 영역의 취약점을 같은 템플릿으로, 실제 CVE와 Docker 실습 환경으로 배운다.</p>
  </a>

  <a class="card" href="kisa-vmc-handbook/">
    <h2>취약점관리센터 직원 안내서</h2>
    <p>KISA 취약점관리센터에 새로 온 사람, 오래 있던 사람, 다른 부서에서 온 사람을 위한 안내서. 공개 자료 기반 비공식 초안.</p>
  </a>

  <footer>본문 CC BY-SA 4.0 · 코드 MIT · <a href="https://github.com/anthonynoh5202/anthonynoh">GitHub</a></footer>
</main>
</body>
</html>
