[book]
title = "취약점관리센터 바이블"
description = "취약점관리센터 직원을 위한 한 권: 센터와 제도, 분석 기술, 현장 적용. 계속 개정되는 살아있는 책"
authors = ["Anthony Noh", "Contributors"]
language = "ko"
src = "src"

[build]
build-dir = "book"
create-missing = false

[preprocessor.internal]
command = "python3 ../../tools/internal-filter.py"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/anthonynoh5202/anthonynoh"
edit-url-template = "https://github.com/anthonynoh5202/anthonynoh/edit/main/books/vmc-bible/{path}"
site-url = "/anthonynoh/"
additional-js = ["theme/mermaid.min.js", "theme/mermaid-init.js"]
additional-css = ["theme/book.css"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[output.html.playground]
runnable = false

# 통합 전 두 책의 주소를 새 위치로 보낸다
